[package]
name = "vlc-gestures"
version = "2.0.0"
edition = "2021"
authors = ["Nandha <myselfnandha@gmail.com>"]
description = "Unified high-performance Linux input & gesture daemon (VLC controls, touch scroll, and smart tap)"
license = "MIT"
repository = "https://github.com/Myselfnandha/vlc-gestures"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
x11rb = { version = "0.13", features = ["xtest", "randr", "allow-unsafe-code"] }
zbus = { version = "5.5", features = ["tokio"] }
evdev = { version = "0.12", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
